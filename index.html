<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lưu bút</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #262421;
            --card: #302d29;
            --text-main: #dfd8cf;
            --text-muted: #9e978e;
            --accent: #5c554c;
            --accent-hover: #736b60;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* --- PHẦN INTRO --- */
        #intro-box {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            transition: opacity 1.5s ease;
            max-width: 600px;
            padding: 0 20px;
        }

        .intro-line {
            font-size: 18px; /* Tăng từ 16px */
            font-weight: 300;
            letter-spacing: 0.5px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .intro-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- PHẦN FORM --- */
        #form-box {
            background-color: var(--card);
            padding: 40px;
            border-radius: 4px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        #form-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        input, textarea {
            width: 100%;
            padding: 16px; /* Tăng padding */
            margin-bottom: 20px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px; /* Tăng từ 14px */
            background-color: #262421;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input::placeholder, textarea::placeholder {
            color: var(--text-muted);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--text-muted);
            background-color: #2b2824;
        }

        textarea {
            resize: none;
            min-height: 160px; /* Tăng nhẹ chiều cao */
        }

        button {
            background-color: var(--accent);
            color: var(--text-main);
            border: none;
            padding: 15px; /* Tăng padding */
            font-size: 15px; /* Tăng từ 14px */
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* --- PHẦN LỜI CẢM ƠN --- */
        #success-msg {
            display: none;
            text-align: center;
            font-size: 18px; /* Tăng từ 16px */
            font-weight: 300;
            letter-spacing: 1px;
            color: var(--text-main);
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="intro-box">
        <div class="intro-line">Chào bạn, mình là Quân.</div>
        <div class="intro-line">Mình có thể không biết ai là người viết những dòng này,</div>
        <div class="intro-line">nhưng mình sẽ không bao giờ quên chúng.</div>
    </div>

    <div id="form-box">
        <form id="luubut-form" action="https://formsubmit.co/leanhq2309@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="Lưu bút mới">
            <input type="hidden" name="_captcha" value="false">
            
            <input type="text" name="Người gửi" placeholder="Bạn là ai? (Hoặc cứ để lại một cái tên không ai biết...)" required>
            <textarea name="Nội dung" placeholder="Những điều bạn muốn nói, hoặc chưa kịp cất lời..." required></textarea>
            
            <button type="submit" id="submit-btn">Gửi đi</button>
        </form>

        <div id="success-msg">
            Thank you for being a part of me.
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const lines = document.querySelectorAll('.intro-line');
            const introBox = document.getElementById('intro-box');
            const formBox = document.getElementById('form-box');

            setTimeout(() => lines[0].classList.add('visible'), 500);
            setTimeout(() => lines[1].classList.add('visible'), 2500);
            setTimeout(() => lines[2].classList.add('visible'), 4500);

            setTimeout(() => {
                introBox.style.opacity = '0';
                setTimeout(() => {
                    introBox.style.display = 'none';
                    formBox.style.display = 'block';
                    setTimeout(() => formBox.classList.add('visible'), 50); 
                }, 1500);
            }, 7500);
        });

        document.getElementById('luubut-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = this;
            const btn = document.getElementById('submit-btn');
            const successMsg = document.getElementById('success-msg');
            
            btn.innerText = 'Đang gửi...';
            btn.disabled = true;

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            })
            .then(response => {
                if (response.ok) {
                    form.style.display = 'none';
                    successMsg.style.display = 'block';
                } else {
                    alert('Lỗi kết nối. Vui lòng thử lại.');
                    btn.innerText = 'Gửi đi';
                    btn.disabled = false;
                }
            })
            .catch(error => {
                alert('Không thể kết nối mạng.');
                btn.innerText = 'Gửi đi';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
